name: Deploy to Namecheap Stellar

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, bcmath, sqlite3, pdo_sqlite
          coverage: none

      - name: Install Dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist

      - name: Prepare deployment package
        run: |
          mkdir -p deploy_package
          cp -r app deploy_package/
          cp -r bootstrap deploy_package/
          cp -r config deploy_package/
          cp -r database deploy_package/
          cp -r public deploy_package/
          cp -r resources deploy_package/
          cp -r routes deploy_package/
          cp -r storage deploy_package/
          cp -r vendor deploy_package/
          cp artisan deploy_package/
          cp composer.json deploy_package/
          cp composer.lock deploy_package/
          cp .env.example deploy_package/
          cp deploy.sh deploy_package/
          chmod +x deploy_package/deploy.sh
          cd deploy_package && tar -czf ../deploy_package.tar.gz .

      - name: Deploy via SSH
        uses: burnett01/rsync-deployments@7.1.0
        with:
          switches: -az --exclude='.env' --exclude='storage/logs/*' --exclude='bootstrap/cache/*.php'
          path: deploy_package/
          remote_path: /home/${{ secrets.SERVER_USER }}/adsmanager/
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          remote_port: 22

      - name: Run deployment commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/${{ secrets.SERVER_USER }}/adsmanager
            
            # Install dependencies if vendor is missing
            if [ ! -f "vendor/autoload.php" ]; then
              composer install --no-dev --optimize-autoloader --prefer-dist
            fi
            
            # Create .env if not exists
            if [ ! -f ".env" ]; then
              cp .env.example .env
              php artisan key:generate --force
            fi
            
            # Create SQLite database if not exists
            if [ ! -f "database/database.sqlite" ]; then
              touch database/database.sqlite
            fi
            
            # Run migrations
            php artisan migrate --force
            
            # Set permissions
            chmod -R 775 storage
            chmod -R 775 bootstrap/cache
            chmod 644 .env
            chmod 600 database/database.sqlite
            
            # Clear and cache
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan optimize:clear
            php artisan optimize
            
            echo "Deployment completed successfully!"
